sentence=Easy buzzer library for active and passive buzzers: beeps, series, melodies and RTTTL ringtones without delay(). Built-in tunes, no dependencies.
paragraph=Plays beeps, beep series, note arrays and RTTTL ringtones on a passive or active buzzer without blocking the program: beep(2000, 100), beepTimes(3), playRTTTL(F("...")) and ready tunes such as Ode to Joy, Twinkle, Happy Birthday, Jingle Bells and start, success, error and alarm signals. Keeps strings in flash memory and explains problems in Russian, Kazakh or English. Works on Arduino AVR, ESP32, ESP8266. Examples included, made for classes and kits by Alash Electronics.
